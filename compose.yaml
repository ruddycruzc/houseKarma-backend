services:
  postgres:
    image: postgres:18
    container_name: housekarma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: housekarma
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - housekarma-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d giacobello"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  housekarma-pgdata: