spring.application.name=housekarma
# ==========================================
# DATABASE - MySQL
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/housekarma_db?useSSL=false&serverTimezone=Europe/Madrid&allowPublicKeyRetrieval=true
spring.datasource.username=housekarma
spring.datasource.password=housekarma
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ==========================================
# SERVER
# ==========================================

server.port=8080